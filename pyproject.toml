[project]
name = "triart"
version = "0.1.0"
description = "Triangle Placement Evolution — local LLM auto-research demo"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "matplotlib>=3.8",
    "imageio>=2.34",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
